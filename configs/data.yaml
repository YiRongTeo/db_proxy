listen:
  addr: ":3306"            # shared port for MySQL + PostgreSQL + MSSQL (protocol detected per connection)
  oracle_addr: ":1522"     # Task 9.14 DEDICATED Oracle/TNS listener (user decision 2026-09-01); empty = off
  detect_delay_ms: 200     # grace period before assuming MySQL (server-first protocol)
  max_conns: 100           # concurrent connection cap enforced by the dispatcher
tls:                      # explicit switch (user directive): enabled: true REQUIRES readable cert_file+key_file (fail-fast at load); false/absent = plaintext
  enabled: false
  cert_file: "certs/data.crt"
  key_file:  "certs/data.key"
valkey:
  mode: direct            # direct | sentinel
  addr: "127.0.0.1:6379"  # direct mode
  master_name: "mymaster" # sentinel mode
  sentinel_addrs: ["127.0.0.1:26379"]
  # Sentinel's OWN auth (requirepass on the sentinel) — SEPARATE from
  # `password` above, which is the MASTER's. Both can differ. Sentinels
  # have NO ACL users: only the password is ever sent (AUTH <password>);
  # there is deliberately no sentinel_username key.
  # Env: ZT_VALKEY_SENTINEL_PASSWORD.
  sentinel_password: ""
  password: ""
  db: 0
  ssl:
    enabled: false
    ca_file: ""
    cert_file: ""
    key_file: ""
    skip_verify: false
# Task 8.7 credential source (user directive 2026-08-13): "config" (default)
# resolves backend DB passwords from the committed credentials list below;
# "api" fetches them per connect from credentials_api.url instead. In api
# mode the password is NEVER stored or logged — it exists in memory only for
# the in-flight connect call. Load fails fast when source=api and the URL is
# empty.
credentials_source: config   # config | api (env: ZT_CREDENTIALS_SOURCE)
credentials_api:
  url: ""                    # vault endpoint, e.g. http://vault:9000/creds (env: ZT_CREDENTIALS_API_URL)
  api_key: ""                # sent as X-Api-Key (env: ZT_CREDENTIALS_API_API_KEY)
  timeout_seconds: 5         # per-request timeout (env: ZT_CREDENTIALS_API_TIMEOUT_SECONDS)
credentials:                  # Data Plane owns DB credentials (zero-trust); key format <dbtype>:<db_user>@<db_ip>:<db_port>
                              # NO SECRETS IN COMMITTED CONFIGS — each password is a ${VAR} placeholder resolved from
                              # .env (git-ignored, see .env.example) or the process environment; unset = load error.
  - key: "mysql:ro_user@127.0.0.1:3307"
    password: "${ZT_CRED_MYSQL_RO_PASSWORD}"
  - key: "mysql:rw_user@127.0.0.1:3307"
    password: "${ZT_CRED_MYSQL_RW_PASSWORD}"
  - key: "postgres:ro_user@127.0.0.1:5433"
    password: "${ZT_CRED_PG_RO_PASSWORD}"
  # Phase 9 (Task 9.1): MSSQL 2022 test backend (mssql-test, host port 1434).
  # SQL logins seeded with CHECK_POLICY=OFF / CHECK_EXPIRATION=OFF (dev only).
  - key: "mssql:ro_user@127.0.0.1:1434"
    password: "${ZT_CRED_MSSQL_RO_PASSWORD}"
  - key: "mssql:rw_user@127.0.0.1:1434"
    password: "${ZT_CRED_MSSQL_RW_PASSWORD}"
  # Task 9.14 Oracle (dedicated listener :1522; backend :1521):
  - key: "oracle:ro_user@127.0.0.1:1521"
    password: "${ZT_CRED_ORACLE_RO_PASSWORD}"
  - key: "oracle:rw_user@127.0.0.1:1521"
    password: "${ZT_CRED_ORACLE_RW_PASSWORD}"
# Task 8.8 query logging (user directive 2026-08-13): every query passing
# through the proxy is ALWAYS logged with full context (username, ticket_id,
# db_user, db, db_type, stmt_type, status, session_id, sql). log_query_output
# (env: ZT_LOG_QUERY_OUTPUT) additionally logs the CAPTURED RESULT payload —
# columns, row_count, rows (capped 100 rows/512 chars/64KB by capture) and the
# truncated flag. Default false: context-only lines, result payload off.
log_query_output: false
# Task 8.13 gate grace hold (user directive 2026-08-14): while a write
# session has NO watcher, blocked SQL commands WAIT up to gate_wait_seconds
# for a checker to attach instead of failing instantly — a maker who connects
# BEFORE the checker no longer breaks; the held commands flush in order when
# the watcher arrives, and the session latches fail-closed if the window
# expires (the maker must reconnect). 0 = reject immediately (the pre-8.13
# behavior). Negative values fall back to the default (20).
# Env: ZT_GATE_WAIT_SECONDS.
gate_wait_seconds: 20
# session enforcement (Task 9.13; all 0 = off):
#   idle_seconds: close sessions idle this long (0 = off). Default 1800.
#     Applies to EVERY token mode (single-use AND session) — the safety
#     valve: a forgotten GUI window cannot pin a backend connection
#     forever. Per-token override: mint with "idle_seconds": N
#     (0 = the default here). Env: ZT_SESSION_IDLE_SECONDS.
#   max_lifetime_seconds: hard cap on session duration from token issue
#     (0 = off). Env: ZT_SESSION_MAX_LIFETIME_SECONDS.
#   revoke_poll_seconds: token-liveness poll interval — deleting tok:<token>
#     by ANY means (control-plane kill, valkey-cli, expiry) closes running
#     sessions within this many seconds (default 1). The keyspace-notification
#     fast path revokes instantly when the server publishes del/expired
#     events (notify-keyspace-events KEx). Env: ZT_SESSION_REVOKE_POLL_SECONDS.
session:
  idle_seconds: 1800
  max_lifetime_seconds: 0
  revoke_poll_seconds: 1
# Task 9.8 metrics (user directive 2026-08-15): OpenTelemetry instruments
# for the data plane, exposed on an HTTP endpoint a Prometheus server can
# scrape. DISABLED by default — zero overhead (the proxies' metrics wrapper
# stays nil, every call site a no-op). When enabled, the plane serves the
# Prometheus text format at http://<listen><path> (default
# http://0.0.0.0:9464/metrics) — point a Prometheus job at that URL.
# Env: ZT_METRICS_ENABLED / ZT_METRICS_LISTEN / ZT_METRICS_PATH.
metrics:
  enabled: false
  listen: "0.0.0.0:9464"
  path: "/metrics"
