http:
  addr: ":8080"
  static_dir: "./web/dist/web/browser"
api:
  token_ttl_seconds: 300
  # token_mode (Task 9.13; env ZT_API_TOKEN_MODE): the DEFAULT token flavor
  # when a mint request carries no mode and the target preset declares none.
  #   single-use (default): consumed atomically per connection budget.
  #   session: IP-locked, NON-consuming token with LIVE revocation — see
  #     api.session_token_ttl_seconds below and data.yaml session.*.
  token_mode: "session"
  # session_token_ttl_seconds (Task 9.13; env ZT_API_SESSION_TOKEN_TTL_SECONDS):
  # lifetime of session-mode tokens. 0 = INFINITE (default): the token lives
  # until revoked — delete tok:<token> by any means (control-plane kill,
  # valkey-cli, an operator tool) and running sessions close immediately
  # (keyspace fast path) or within session.revoke_poll_seconds (poll backstop).
  # The data plane's session.idle_seconds is the recommended safety valve.
  session_token_ttl_seconds: 0
  # token_max_uses (Task 9.12, option-2 multi-use; env ZT_TOKEN_MAX_USES):
  # how many CONNECTIONS one issued token may open before it is deleted.
  # 1 = single-use (the zero-trust default — one token, one connection).
  # GUI clients (SSMS/DBeaver/Azure Data Studio) open several connections
  # per session automatically, so a small budget (e.g. 4) makes them
  # usable; the TTL still bounds the window and each use is atomic, so a
  # stolen token can open at most this many connections.
  token_max_uses: 4
  data_plane_host: "127.0.0.1"
  data_plane_port: "3306"      # shared Data Plane listener (MySQL + PostgreSQL + MSSQL)
auth:
  # JWT/roles auth (2026-09-05 conversion). The retired control-plane API
  # key (api.api_key / ZT_API_API_KEY / X-Api-Key on /api/*) is GONE — do
  # NOT re-add it; mint auth is bearer-JWT only. (The DATA plane's
  # credentials_api.api_key in data.yaml is a different key and still
  # exists for vault calls.) Operator switches: auth.jwt.login_enabled
  # (true = UI login on; false = external-JWT-only), auth.jwt.allowed_origins
  # (cross-origin checker WS allowlist; no dedicated env binding — AutomaticEnv
  # maps ZT_AUTH_JWT_ALLOWED_ORIGINS, comma-separated), auth.role /
  # auth.users[].role (maker|checker), auth.allow_maker_watch (false =
  # strict SoD).
  username: "admin"
  password: ""                # NO SECRETS IN COMMITTED CONFIGS — set ZT_AUTH_PASSWORD in .env (see .env.example); empty = plane refuses to start
  # role (JWT conversion): the PRIMARY account's role — "maker" or
  # "checker". REQUIRED when auth.jwt.login_enabled is true; no silent
  # default (an un-role'd account would be an accidental superuser).
  role: "maker"
  # allow_maker_watch (JWT conversion): false (default) = only checker-role
  # principals may watch/kill sessions (SoD); true lets makers watch too.
  allow_maker_watch: false
  # users (Task 9.13): OPTIONAL extra UI accounts beyond the primary pair —
  # e.g. a dedicated CHECKER so maker and checker roles use different
  # identities (the SoD watch rejects checker == maker). Passwords are
  # ${VAR} placeholders from the environment; empty = plane refuses to start.
  # Each entry declares its own role (required when login_enabled).
  users:
    - username: "checker"
      password: "${ZT_AUTH_CHECKER_PASSWORD}"
      role: "checker"
  # jwt (JWT conversion): the bearer-JWT auth block. enabled ABSENT = true
  # (JWT is the mode; an unmigrated config fails fast demanding roles +
  # secret). An explicit false DISABLES JWT verification — every guarded
  # route answers 401 (fail closed); there is NO legacy cookie mode anymore
  # (the cookie-session machinery was removed in the conversion), so keep
  # the default true. login_enabled registers /api/login + /api/logout
  # (self-issued HS256 JWTs); false = external-JWT-only (username/password
  # then NOT required).
  # ttl_seconds (28800 = 8h) replaces session_ttl_hours as the auth expiry.
  jwt:
    enabled: true
    login_enabled: true
    issuer: "zerotrust-proxy"
    audience: "zt-api"
    ttl_seconds: 28800
    secret: "${ZT_JWT_SECRET}"  # NO SECRETS IN COMMITTED CONFIGS — set ZT_JWT_SECRET in .env (see .env.example); REQUIRED when login_enabled; empty = plane refuses to start
    # allowed_origins (Task 9): cross-origin host allowlist for the CHECKER
    # WebSocket upgrade ONLY (/ws/checker). Browsers cannot set headers on a
    # WebSocket upgrade, so a checker SPA served from ANOTHER origin must be
    # allow-listed here. EMPTY (default) = same-origin only (today's
    # behavior): an upgrade whose Origin host differs from the control-plane
    # host is rejected 403 before the handshake. Patterns are lowercase host
    # globs — "checker.example.com", "*.example.com"; prefix the scheme
    # ("https://checker.example.com") to pin it too. REST routes ignore this
    # list (their JWTs ride the Authorization header only). No dedicated env
    # binding — AutomaticEnv still maps ZT_AUTH_JWT_ALLOWED_ORIGINS
    # (comma-separated) if set; set the list here in yaml for clarity.
    allowed_origins: []
  # session_ttl_hours is INERT LEGACY RESIDUE of the cookie-session era: it
  # is still parsed (default 8) into an UNUSED ControlConfig.SessionTTL
  # field for backward compatibility, but NOTHING consumes it — the live
  # auth expiry is jwt.ttl_seconds above (28800 = 8h). Safe to delete this
  # key entirely; the parse will be removed with the field.
  session_ttl_hours: 8
db_presets:
  - name: "MySQL read-only"
    db_type: "mysql"
    db_user: "ro_user"
    db_ip: "127.0.0.1"
    db_port: "3307"
    access: "read"
  - name: "MySQL read-write"
    db_type: "mysql"
    db_user: "rw_user"
    db_ip: "127.0.0.1"
    db_port: "3307"
    access: "write"
  - name: "PostgreSQL read-only"
    db_type: "postgres"
    db_user: "ro_user"
    db_ip: "127.0.0.1"
    db_port: "5433"
    access: "read"
  # Phase 9 (Task 9.1): MSSQL 2022 test backend (mssql-test, host port 1434).
  # Credentials resolve via data.yaml keys mssql:ro_user@127.0.0.1:1434 /
  # mssql:rw_user@127.0.0.1:1434 (Task 8.7 key format <dbtype>:<db_user>@<db_ip>:<db_port>).
  - name: "MSSQL read-only"
    db_type: "mssql"
    db_user: "ro_user"
    db_ip: "127.0.0.1"
    db_port: "1434"
    access: "read"
  - name: "MSSQL read-write"
    db_type: "mssql"
    db_user: "rw_user"
    db_ip: "127.0.0.1"
    db_port: "1434"
    access: "write"
  # Task 9.14 Oracle (dedicated proxy listener :1522; backend :1521):
  - name: "Oracle read-only"
    db_type: "oracle"
    db_user: "ro_user"
    db_ip: "127.0.0.1"
    db_port: "1521"
    access: "read"
  - name: "Oracle read-write"
    db_type: "oracle"
    db_user: "rw_user"
    db_ip: "127.0.0.1"
    db_port: "1521"
    access: "write"
tls:                      # explicit switch (user directive): enabled: true REQUIRES readable cert_file+key_file (fail-fast at load); false/absent = plaintext
  enabled: false
  cert_file: "certs/control.crt"
  key_file:  "certs/control.key"
valkey:
  mode: direct            # direct | sentinel
  addr: "127.0.0.1:6379"  # direct mode
  master_name: "mymaster" # sentinel mode
  sentinel_addrs: ["127.0.0.1:26379"]
  # Sentinel's OWN auth (requirepass on the sentinel) — SEPARATE from
  # `password` above, which is the MASTER's. Both can differ. Sentinels
  # have NO ACL users: only the password is ever sent (AUTH <password>);
  # there is deliberately no sentinel_username key.
  # Env: ZT_VALKEY_SENTINEL_PASSWORD.
  sentinel_password: ""
  password: ""
  db: 0
  ssl:
    enabled: false
    ca_file: ""
    cert_file: ""
    key_file: ""
    skip_verify: false
# Task 9.7 session audit (user directive 2026-08-15): the Control Plane
# persists every session to MySQL — maker username, ticket, db target,
# checker username when present, status (pending|active|ended), timestamps.
# SINK COMPATIBILITY (review 2026-08-17): MariaDB or MySQL 5.7+ — the
# upserts use the portable VALUES() syntax (the MySQL 8.0.19+ alias form
# fails on MariaDB and is deliberately not used).
# DISABLED by default (no DB dependency unless enabled). When enabled the
# writer auto-creates the zt_audit database + sessions table at startup and
# fail-fasts if the database is unreachable; runtime write failures are
# logged and NEVER break the token/connect flow.
# Env: ZT_AUDIT_MYSQL_ENABLED / ZT_AUDIT_MYSQL_HOST / ZT_AUDIT_MYSQL_PORT /
# ZT_AUDIT_MYSQL_USER / ZT_AUDIT_MYSQL_PASSWORD / ZT_AUDIT_MYSQL_DATABASE.
audit:
  mysql:
    enabled: false
    host: "127.0.0.1"
    port: "3307"
    user: "root"            # dev container root (RUN.md §1.2); needs CREATE DATABASE — use a dedicated user in prod
    password: ""            # NO SECRETS IN COMMITTED CONFIGS — set ZT_AUDIT_MYSQL_PASSWORD in .env (see .env.example); empty = plane refuses to start when enabled
    database: "zt_audit"
