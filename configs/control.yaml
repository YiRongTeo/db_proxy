http:
  addr: ":8080"
  static_dir: "./web/dist/web/browser"
api:
  api_key: ""                 # empty → external /api/token disabled; set via ZT_API_API_KEY (viper maps api.api_key → ZT_API_API_KEY, NOT ZT_API_KEY)
  token_ttl_seconds: 300
  data_plane_host: "127.0.0.1"
  data_plane_port: "3306"      # shared Data Plane listener (MySQL + PostgreSQL)
auth:
  username: "admin"
  password: "admin123"        # override via ZT_AUTH_PASSWORD
  session_ttl_hours: 8
db_presets:
  - name: "MySQL read-only"
    db_type: "mysql"
    db_user: "ro_user"
    db_ip: "127.0.0.1"
    db_port: "3307"
    access: "read"
  - name: "MySQL read-write"
    db_type: "mysql"
    db_user: "rw_user"
    db_ip: "127.0.0.1"
    db_port: "3307"
    access: "write"
  - name: "PostgreSQL read-only"
    db_type: "postgres"
    db_user: "ro_user"
    db_ip: "127.0.0.1"
    db_port: "5433"
    access: "read"
tls:                      # explicit switch (user directive): enabled: true REQUIRES readable cert_file+key_file (fail-fast at load); false/absent = plaintext
  enabled: false
  cert_file: "certs/control.crt"
  key_file:  "certs/control.key"
valkey:
  mode: direct            # direct | sentinel
  addr: "127.0.0.1:6379"  # direct mode
  master_name: "mymaster" # sentinel mode
  sentinel_addrs: ["127.0.0.1:26379"]
  password: ""
  db: 0
  ssl:
    enabled: false
    ca_file: ""
    cert_file: ""
    key_file: ""
    skip_verify: false
