# sentinel.conf — Project-D dev sentinel (Tasks 7.6 + 7.7)
# Monitors the PLAINTEXT master valkey on host 127.0.0.1:6379.
# Client -> sentinel and client -> master TLS is handled by the store's
# valkey.ssl block; sentinel TLS is optional and NOT enabled in dev.
# Task 7.7: sentinel itself is authenticated (requirepass sentinelpw) —
# clients must pass valkey.sentinel_password; the master's own password
# (valkey.password) is separate and stays with the master/data conns.
sentinel monitor mymaster 127.0.0.1 6379 1
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
requirepass sentinelpw
